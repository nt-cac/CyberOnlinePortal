
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberOnline Portal</title>

<style>
:root{
    --bg:#050914;
    --panel:#0d1526;
    --panel-light:#111d33;
    --cyan:#00d4ff;
    --green:#00e5a0;
    --yellow:#ffcc00;
    --red:#ff4768;
    --text:#edf5ff;
    --muted:#8292ad;
    --border:rgba(0,212,255,.18);
}
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Segoe UI",Inter,Arial,sans-serif;
}
body{
    min-height:100vh;
    background:radial-gradient(circle at top right,#11294a,#050914 45%);
    color:var(--text);
    display:flex;
    flex-direction:column;
}
header{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    background:rgba(13,21,38,.9);
    border-bottom:1px solid var(--border);
}
.logo{
    font-size:24px;
    font-weight:800;
    color:var(--cyan);
    letter-spacing:1px;
}
.status{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--muted);
}
.status-dot{
    height:12px;
    width:12px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 15px var(--green);
}
.toolbar{
    display:flex;
    gap:12px;
    padding:18px;
    background:#080f1e;
    border-bottom:1px solid var(--border);
}
input{
    flex:1;
    min-width:0;
    background:#111c32;
    border:1px solid var(--border);
    color:white;
    padding:14px;
    border-radius:10px;
    font-size:15px;
    outline:none;
}
input:focus{
    border-color:var(--cyan);
}
button{
    background:var(--cyan);
    border:none;
    color:#00131b;
    font-weight:800;
    border-radius:10px;
    padding:0 22px;
    cursor:pointer;
    transition:.25s;
}
button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(0,212,255,.4);
}
main{
    flex:1;
    display:grid;
    grid-template-columns:minmax(0,2fr) minmax(300px,420px);
    gap:18px;
    padding:18px;
    overflow-y:auto;
}
.card{
    background:rgba(13,21,38,.92);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
}
.card-title{
    padding:16px;
    font-weight:700;
    border-bottom:1px solid var(--border);
    color:var(--cyan);
}
.browser{
    display:flex;
    flex-direction:column;
    min-height:400px;
}
.browser-window{
    flex:1;
    min-height:300px;
    position:relative;
    background:white;
    color:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}
.browser-placeholder{
    color:#778;
    font-size:22px;
    text-align:center;
    padding:20px;
}
#websiteFrame{
    width:100%;
    height:100%;
    min-height:300px;
    border:none;
    background:white;
    flex:1;
}
.sidebar{
    display:flex;
    flex-direction:column;
    gap:18px;
    min-width:0;
}
.panel{
    padding:18px;
}
.panel h3{
    color:var(--cyan);
    margin-bottom:15px;
}
.score{
    text-align:center;
    font-size:45px;
    font-weight:800;
    margin:15px;
}
.safe{color:var(--green);}
.warning{color:var(--yellow);}
.danger{color:var(--red);}
.metric{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin:10px 0;
    color:var(--muted);
}
.value{
    color:white;
    font-weight:700;
    text-align:right;
    overflow-wrap:anywhere;
}
.flag{
    background:#111c32;
    border-radius:8px;
    padding:9px;
    margin-top:8px;
    font-size:13px;
    overflow-wrap:anywhere;
}
.chat-box{
    height:220px;
    overflow:auto;
    background:#080f1c;
    border-radius:10px;
    padding:12px;
}
.message{margin-bottom:12px;}
.ai{
    background:#111d33;
    padding:10px;
    border-radius:8px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}
.user{
    background:rgba(0,212,255,.12);
    padding:10px;
    border-radius:8px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}
.chat-row{
    display:flex;
    gap:8px;
    margin-top:10px;
}
.chat-row button{padding:0 15px;}
.history-button{
    width:100%;
    padding:12px;
    margin-top:12px;
}
@media(max-width:1000px){
    main{
        grid-template-columns:minmax(0,1fr);
        overflow:visible;
    }
    .browser{
        min-height:400px;
    }
}
@media(max-width:600px){
    header{
        padding:15px;
        gap:12px;
        flex-wrap:wrap;
    }
    .logo{
        font-size:19px;
    }
    .toolbar{
        padding:12px;
    }
    .toolbar button{
        padding:0 12px;
    }
    main{
        padding:12px;
    }
}
</style>
</head>

<body>
<header>
    <div class="logo">CYBERONLINE PORTAL</div>
    <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">AI Ready</span>
    </div>
</header>

<div class="toolbar">
    <input id="urlInput" placeholder="Enter website URL...">
    <button onclick="scanWebsite()">AI SCAN</button>
</div>

<main>
    <section class="card browser">
        <div class="card-title">Secure Website Preview</div>
        <div class="browser-window" id="browserWindow">
            <div class="browser-placeholder" id="browserPlaceholder">
                Enter a website URL and click AI SCAN to preview it.
            </div>
            <iframe
                id="websiteFrame"
                title="Website security preview"
                sandbox="allow-scripts allow-forms"
                referrerpolicy="no-referrer"
                loading="lazy"
                style="display:none;"
            ></iframe>
        </div>
    </section>

    <section class="sidebar">
        <div class="card panel">
            <h3>Security Report</h3>
            <div id="riskScore" class="score">--</div>
            <div class="metric">
                <span>Verdict</span>
                <span id="verdict" class="value">Waiting</span>
            </div>
            <div class="metric">
                <span>Domain</span>
                <span id="domain" class="value">--</span>
            </div>
            <div id="flags"></div>
            <button class="history-button" onclick="showHistory()">
                VIEW SCAN HISTORY
            </button>
        </div>

        <div class="card panel">
            <h3>AI Assistant</h3>
            <div id="chatBox" class="chat-box">
                <div class="message">
                    <div class="ai">Enter a website URL to begin analysis.</div>
                </div>
            </div>
            <div class="chat-row">
                <input id="chatInput" placeholder="Ask about the scan...">
                <button onclick="sendChat()">Send</button>
            </div>
        </div>
    </section>
</main>

<script>
/*
CyberOnline Portal

Scores are based on consistent URL warning rules.
This is not a live malware scanner or a full security audit.
The AI assistant uses the existing /api/chat Netlify endpoint.
*/

const MODEL = "openai/gpt-oss-120b";
let currentScan = null;
let currentURL = "";
let chatHistory = [];

// URL helpers
function normalizeURL(url){
    url = url.trim();

    if(!/^https?:\/\//i.test(url)){
        url = "https://" + url;
    }

    return url;
}

function getDomain(url){
    try{
        return new URL(normalizeURL(url)).hostname;
    }
    catch{
        return "Unknown";
    }
}

// Saved scan history
function getScanHistory(){
    try{
        const history = JSON.parse(
            localStorage.getItem("cyberScanHistory") || "[]"
        );

        return Array.isArray(history) ? history : [];
    }
    catch{
        return [];
    }
}

function saveScan(url,scan){
    let history = getScanHistory();

    // Update the previous entry for this exact URL.
    history = history.filter(item => item.url !== url);

    history.unshift({
        url:url,
        domain:getDomain(url),
        score:scan.score,
        verdict:scan.verdict,
        flags:scan.flags,
        summary:scan.summary,
        date:new Date().toISOString()
    });

    history = history.slice(0,20);

    try{
        localStorage.setItem(
            "cyberScanHistory",
            JSON.stringify(history)
        );
    }
    catch(error){
        console.warn("Scan history could not be saved.");
    }
}

// Consistent URL-based scoring
function checkWebsite(url){
    const site = new URL(url);
    const host = site.hostname.toLowerCase();

    let score = 0;
    let flags = [];

    function addRisk(points,message){
        score += points;
        flags.push(message);
    }

    // HTTP does not encrypt the connection.
    if(site.protocol === "http:"){
        addRisk(
            25,
            "The URL uses HTTP instead of HTTPS."
        );
    }

    // Check for an IP address instead of a domain.
    const isIPv4 =
        /^(\d{1,3}\.){3}\d{1,3}$/.test(host);

    const isIPv6 = host.includes(":");

    if(isIPv4 || isIPv6){
        addRisk(
            20,
            "The URL uses an IP address instead of a regular domain name."
        );
    }

    // Encoded internationalized domain names need careful inspection.
    if(host.includes("xn--")){
        addRisk(
            25,
            "The domain contains encoded international characters."
        );
    }

    // Credentials embedded in a URL are a warning sign.
    if(site.username || site.password){
        addRisk(
            30,
            "The URL contains embedded username or password information."
        );
    }

    // Nonstandard ports can deserve additional inspection.
    if(site.port && site.port !== "80" && site.port !== "443"){
        addRisk(
            15,
            "The URL uses a nonstandard web port."
        );
    }

    // Words alone do not prove a site is malicious.
    // They contribute only a limited warning score.
    const suspiciousWords = [
        "verify",
        "password",
        "signin",
        "login",
        "account",
        "wallet",
        "urgent",
        "gift",
        "free-prize"
    ];

    const fullURL = url.toLowerCase();
    let foundWords = [];

    suspiciousWords.forEach(word=>{
        if(fullURL.includes(word)){
            foundWords.push(word);
        }
    });

    if(foundWords.length > 0){
        addRisk(
            Math.min(foundWords.length * 10,25),
            "Potentially sensitive or deceptive terms found in URL: " +
            foundWords.join(", ") + ". These terms are not proof of a threat."
        );
    }

    if(host.length > 50){
        addRisk(
            10,
            "The hostname is unusually long."
        );
    }

    const parts = host.split(".");

    if(parts.length > 5){
        addRisk(
            10,
            "The domain has an unusually large number of subdomains."
        );
    }

    score = Math.min(score,100);

    let verdict;

    if(score <= 20){
        verdict = "Low Apparent URL Risk";
    }
    else if(score <= 50){
        verdict = "Warning";
    }
    else{
        verdict = "High Apparent URL Risk";
    }

    if(flags.length === 0){
        flags.push(
            "No warning signs were found by these basic URL checks."
        );
    }

    return {
        score:score,
        verdict:verdict,
        flags:flags,
        summary:
            "This score is based on basic URL characteristics. " +
            "It is not a live malware scan or a full security audit. " +
            "A low score does not prove that a website is safe."
    };
}

// Website preview
function loadWebsitePreview(url){
    const frame = document.getElementById("websiteFrame");
    const placeholder =
        document.getElementById("browserPlaceholder");

    try{
        const site = new URL(url);

        if(site.protocol !== "https:" &&
           site.protocol !== "http:"){
            throw new Error("Invalid URL");
        }

        frame.src = site.href;
        frame.style.display = "block";
        placeholder.style.display = "none";
    }
    catch(error){
        frame.removeAttribute("src");
        frame.style.display = "none";
        placeholder.style.display = "block";
        placeholder.textContent =
            "Please enter a valid website URL.";
    }
}

// Chat display
function addChat(type,text){
    const box = document.getElementById("chatBox");
    const message = document.createElement("div");
    const content = document.createElement("div");

    message.className = "message";
    content.className = type;
    content.textContent = String(text);

    message.appendChild(content);
    box.appendChild(message);
    box.scrollTop = box.scrollHeight;
}

// AI connection
async function askAI(prompt){
    const response = await fetch("/api/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            model:MODEL,
            temperature:0,
            max_tokens:700,
            messages:[
                {
                    role:"system",
                    content:`
You are CyberOnline Portal, a cybersecurity assistant.

Explain cybersecurity information clearly and honestly.

The website's score is calculated by fixed URL checks.
Do not invent security checks, malware database results,
confirmed vulnerabilities, or facts about a website.

Do not change the score supplied in the scan report.
A low URL risk score does not prove that a website is safe.

Clearly explain that URL checks are limited and that no
live threat database check is being performed by this system.
Answer user questions briefly and accurately.
`
                },
                ...chatHistory,
                {role:"user",content:prompt}
            ]
        })
    });

    if(!response.ok){
        throw new Error("AI request failed");
    }

    const data = await response.json();

    return data?.choices?.[0]?.message?.content || "";
}

// Website scan

async function scanWebsite(){
    let url = document.getElementById("urlInput").value.trim();

    if(!url){
        alert("Enter a website URL");
        return;
    }

    url = normalizeURL(url);

    try{
        const parsed = new URL(url);

        if(
            (parsed.protocol !== "https:" &&
             parsed.protocol !== "http:") ||
            !parsed.hostname.includes(".") ||
            parsed.username ||
            parsed.password
        ){
            throw new Error("Invalid URL");
        }
    }
    catch{
        alert("Enter a valid website URL.");
        return;
    }

    currentURL = url;
    loadWebsitePreview(url);

    document.getElementById("statusText").textContent =
        "Checking threats...";

    document.getElementById("statusDot").style.background =
        "#ffcc00";

    addChat("ai","Checking the URL against Google Safe Browsing...");

    try{
        const response = await fetch("/api/scan",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({url:url})
        });

        const result = await response.json();

        if(!response.ok){
            throw new Error(
                result.error || "Threat check failed."
            );
        }

        currentScan = result;

        displayReport(currentScan,url);
        saveScan(url,currentScan);

        document.getElementById("statusText").textContent =
            "Checks Complete";

        document.getElementById("statusDot").style.background =
            "#00e5a0";

    }
    catch(error){
        console.error(error);

        document.getElementById("statusText").textContent =
            "Scan Unavailable";

        document.getElementById("statusDot").style.background =
            "#ff4768";

        addChat(
            "ai",
            "The scan could not be completed: " + error.message
        );
    }
}


// Display report
function displayReport(scan,url){
    const score = document.getElementById("riskScore");

    score.textContent = scan.score + "/100";
    score.className = "score";

    if(scan.score <= 20){
        score.classList.add("safe");
    }
    else if(scan.score <= 50){
        score.classList.add("warning");
    }
    else{
        score.classList.add("danger");
    }

    document.getElementById("verdict").textContent =
        scan.verdict;

    document.getElementById("domain").textContent =
        getDomain(url);

    const flags = document.getElementById("flags");
    flags.innerHTML = "";

    scan.flags.forEach(flag=>{
        const item = document.createElement("div");
        item.className = "flag";
        item.textContent = "⚠ " + flag;
        flags.appendChild(item);
    });

    addChat(
        "ai",
        "URL CHECK REPORT\n\n" +
        "Domain: " + getDomain(url) + "\n" +
        "Score: " + scan.score + "/100\n" +
        "Verdict: " + scan.verdict + "\n\n" +
        "Findings:\n- " + scan.flags.join("\n- ") + "\n\n" +
        scan.summary
    );
}

// View saved scans
function showHistory(){
    const history = getScanHistory();

    if(history.length === 0){
        addChat("ai","No saved scans yet. Scan a website first.");
        return;
    }

    let result = "SAVED SCAN HISTORY\n\n";

    history.forEach((scan,index)=>{
        result +=
            (index + 1) + ". " + scan.domain + "\n" +
            "Score: " + scan.score + "/100\n" +
            "Verdict: " + scan.verdict + "\n" +
            "Date: " + new Date(scan.date).toLocaleString() +
            "\n\n";
    });

    addChat("ai",result);
}

// AI Assistant
async function sendChat(){
    const input = document.getElementById("chatInput");
    const message = input.value.trim();

    if(!message) return;

    input.value = "";
    addChat("user",message);

    const lowerMessage = message.toLowerCase();

    if(
        lowerMessage.includes("scan history") ||
        lowerMessage.includes("previous scans") ||
        lowerMessage.includes("past scans") ||
        lowerMessage.includes("history")
    ){
        showHistory();
        return;
    }

    let context = "";

    if(currentScan){
        context =
            "Current scan URL: " + currentURL + "\n" +
            "Current scan report: " +
            JSON.stringify(currentScan) + "\n";
    }

    const prompt = context +
        "User question: " + message +
        "\nAnswer briefly.";

    try{
        const answer = await askAI(prompt);

        addChat("ai",answer || "No response was returned.");
    }
    catch(error){
        console.error(error);
        addChat("ai","AI unavailable. Check your backend connection.");
    }
}

// Enter key shortcuts
document.getElementById("urlInput").addEventListener(
    "keydown",
    function(e){
        if(e.key === "Enter"){
            scanWebsite();
        }
    }
);

document.getElementById("chatInput").addEventListener(
    "keydown",
    function(e){
        if(e.key === "Enter"){
            sendChat();
        }
    }
);
</script>
</body>
</html>
