
<script>
const MODEL = "openai/gpt-oss-120b";
let currentScan = null;
let chatHistory = [];

// URL helpers
function normalizeURL(url){
    url = url.trim();

    if(!/^https?:\/\//i.test(url)){
        url = "https://" + url;
    }

    return url;
}

function getDomain(url){
    try{
        return new URL(normalizeURL(url)).hostname;
    }
    catch{
        return "Unknown";
    }
}

// Saved scan history
function getScanHistory(){
    try{
        return JSON.parse(localStorage.getItem("cyberScanHistory")) || [];
    }
    catch{
        return [];
    }
}

function saveScan(url,scan){
    let history = getScanHistory();

    history.unshift({
        url:url,
        domain:getDomain(url),
        score:scan.score,
        verdict:scan.verdict,
        flags:scan.flags,
        summary:scan.summary,
        date:new Date().toISOString()
    });

    history = history.slice(0,20);

    try{
        localStorage.setItem(
            "cyberScanHistory",
            JSON.stringify(history)
        );
    }
    catch(error){
        console.log("Could not save scan history.");
    }
}

// Basic, repeatable URL checks
function checkWebsite(url){
    const site = new URL(url);
    const host = site.hostname.toLowerCase();
    const fullURL = url.toLowerCase();

    let score = 0;
    let flags = [];
    let checks = [];

    function addRisk(points,message){
        score += points;
        flags.push(message);
    }

    // HTTPS check
    if(site.protocol === "http:"){
        addRisk(
            25,
            "The URL uses HTTP instead of encrypted HTTPS."
        );
    }
    else{
        checks.push("The URL uses HTTPS.");
    }

    // IP address instead of a domain name
    const isIPv4 =
        /^(\d{1,3}\.){3}\d{1,3}$/.test(host);

    const isIPv6 = host.includes(":");

    if(isIPv4 || isIPv6){
        addRisk(
            20,
            "The website uses an IP address instead of a regular domain name."
        );
    }

    // Internationalized domain name
    if(host.includes("xn--")){
        addRisk(
            25,
            "The domain contains encoded international characters that may need closer inspection."
        );
    }

    // Username or password embedded in URL
    if(site.username || site.password){
        addRisk(
            30,
            "The URL contains embedded username or password information."
        );
    }

    // Unusual port
    if(site.port && site.port !== "80" && site.port !== "443"){
        addRisk(
            15,
            "The URL uses a nonstandard web port."
        );
    }

    // Suspicious words are warning signs, not proof
    const suspiciousWords = [
        "verify",
        "password",
        "signin",
        "login",
        "account",
        "wallet",
        "urgent",
        "gift",
        "free-prize"
    ];

    let foundWords = [];

    suspiciousWords.forEach(word=>{
        if(fullURL.includes(word)){
            foundWords.push(word);
        }
    });

    if(foundWords.length > 0){
        addRisk(
            Math.min(foundWords.length * 10,25),
            "The URL contains potentially sensitive or deceptive terms: " +
            foundWords.join(", ") + "."
        );
    }

    // Very long hostname
    if(host.length > 50){
        addRisk(
            10,
            "The hostname is unusually long and deserves closer inspection."
        );
    }

    // Excessive subdomains
    const parts = host.split(".");

    if(parts.length > 5){
        addRisk(
            10,
            "The domain has an unusually large number of subdomains."
        );
    }

    score = Math.min(score,100);

    let verdict;

    if(score <= 20){
        verdict = "Low Apparent URL Risk";
    }
    else if(score <= 50){
        verdict = "Warning";
    }
    else{
        verdict = "High Apparent URL Risk";
    }

    if(flags.length === 0){
        flags.push(
            "No warning signs were found by these basic URL checks."
        );
    }

    return {
        score:score,
        verdict:verdict,
        flags:flags,
        checks:checks,
        summary:
            "This score is based on basic URL characteristics, " +
            "not a live malware scan or a full security audit. " +
            "A low score does not prove that a website is safe."
    };
}

// Website preview
function loadWebsitePreview(url){
    const frame = document.getElementById("websiteFrame");
    const placeholder =
        document.getElementById("browserPlaceholder");

    try{
        const site = new URL(url);

        if(site.protocol !== "https:" &&
           site.protocol !== "http:"){
            throw new Error("Invalid URL");
        }

        frame.src = site.href;
        frame.style.display = "block";
        placeholder.style.display = "none";
    }
    catch(error){
        frame.removeAttribute("src");
        frame.style.display = "none";
        placeholder.style.display = "block";
        placeholder.textContent =
            "Please enter a valid website URL.";
    }
}

// Chat display
function addChat(type,text){
    const box = document.createElement("div");
    box.className = "message";

    const message = document.createElement("div");
    message.className = type;
    message.textContent = text;

    box.appendChild(message);

    document.getElementById("chatBox").appendChild(box);
    document.getElementById("chatBox").scrollTop =
        document.getElementById("chatBox").scrollHeight;
}

// AI connection
async function askAI(prompt){
    const response = await fetch("/api/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            model:MODEL,
            temperature:0,
            max_tokens:700,
            messages:[
                {
                    role:"system",
                    content:`
You are the CyberOnline Portal AI assistant.

Explain cybersecurity concepts clearly and honestly.

When discussing a website scan, use only the scan
information provided to you. Never invent security checks,
threat database results, or confirmed vulnerabilities.

The displayed score is calculated by fixed URL checks.
Do not change that score or claim that a website is
guaranteed safe.

A low URL risk score does not prove a website is safe.
Explain limitations when relevant.
Answer briefly unless more detail is requested.
`
                },
                ...chatHistory,
                {role:"user",content:prompt}
            ]
        })
    });

    if(!response.ok){
        throw new Error("AI request failed");
    }

    const data = await response.json();

    return data?.choices?.[0]?.message?.content || "";
}

// Website scan
async function scanWebsite(){
    let url = document.getElementById("urlInput").value.trim();

    if(!url){
        alert("Enter a website URL");
        return;
    }

    url = normalizeURL(url);

    try{
        const parsed = new URL(url);

        if(parsed.protocol !== "https:" &&
           parsed.protocol !== "http:"){
            throw new Error("Invalid protocol");
        }

        if(!parsed.hostname || !parsed.hostname.includes(".")){
            throw new Error("Invalid hostname");
        }
    }
    catch{
        alert("Enter a valid website URL.");
        return;
    }

    loadWebsitePreview(url);

    document.getElementById("statusText").textContent =
        "Checking URL...";
    document.getElementById("statusDot").style.background =
        "#ffcc00";

    addChat("ai","Running basic URL security checks...");

    try{
        // The score comes from fixed rules, not AI guesses.
        currentScan = checkWebsite(url);

        displayReport(currentScan,url);
        saveScan(url,currentScan);

        document.getElementById("statusText").textContent =
            "Checks Complete";
        document.getElementById("statusDot").style.background =
            "#00e5a0";

    }
    catch(error){
        console.error(error);

        addChat("ai","The URL could not be checked.");

        document.getElementById("statusDot").style.background =
            "#ff4768";
        document.getElementById("statusText").textContent =
            "Check Failed";
    }
}

// Display report
function displayReport(scan,url){
    const score = document.getElementById("riskScore");

    score.textContent = scan.score + "/100";
    score.className = "score";

    if(scan.score <= 20){
        score.classList.add("safe");
    }
    else if(scan.score <= 50){
        score.classList.add("warning");
    }
    else{
        score.classList.add("danger");
    }

    document.getElementById("verdict").textContent =
        scan.verdict;

    document.getElementById("domain").textContent =
        getDomain(url);

    const flags = document.getElementById("flags");
    flags.innerHTML = "";

    scan.flags.forEach(flag=>{
        const item = document.createElement("div");
        item.className = "flag";
        item.textContent = "⚠ " + flag;
        flags.appendChild(item);
    });

    addChat(
        "ai",
        "URL CHECK REPORT\n\n" +
        "Domain: " + getDomain(url) + "\n" +
        "Score: " + scan.score + "/100\n" +
        "Verdict: " + scan.verdict + "\n\n" +
        "Findings:\n- " + scan.flags.join("\n- ") + "\n\n" +
        scan.summary + "\n\n" +
        "This report has been saved in your local scan history."
    );
}

// Chat and saved history
async function sendChat(){
    const input = document.getElementById("chatInput");
    const message = input.value.trim();

    if(!message) return;

    input.value = "";
    addChat("user",message);

    const lowerMessage = message.toLowerCase();

    // Show locally saved scan history on request
    if(
        lowerMessage.includes("scan history") ||
        lowerMessage.includes("previous scans") ||
        lowerMessage.includes("past scans") ||
        lowerMessage.includes("history")
    ){
        const history = getScanHistory();

        if(history.length === 0){
            addChat("ai","No saved scans yet. Scan a website first.");
            return;
        }

        let result = "YOUR LAST " + history.length + " SCANS\n\n";

        history.forEach((scan,index)=>{
            result +=
                (index + 1) + ". " + scan.domain + "\n" +
                "Score: " + scan.score + "/100\n" +
                "Verdict: " + scan.verdict + "\n" +
                "Date: " + new Date(scan.date).toLocaleString() +
                "\n\n";
        });

        addChat("ai",result);
        return;
    }

    chatHistory.push({
        role:"user",
        content:message
    });

    let context = "";

    if(currentScan){
        context +=
            "Current scan report:\n" +
            JSON.stringify(currentScan) + "\n";
    }

    try{
        const answer = await askAI(
            context +
            "User question: " + message
        );

        addChat("ai",answer);

        chatHistory.push({
            role:"assistant",
            content:answer
        });

        // Keep chat history from growing indefinitely
        if(chatHistory.length > 20){
            chatHistory = chatHistory.slice(-20);
        }
    }
    catch(error){
        addChat("ai","AI unavailable. Check your backend connection.");
    }
}

// Enter key shortcuts
document.getElementById("urlInput").addEventListener(
    "keydown",
    function(e){
        if(e.key === "Enter"){
            scanWebsite();
        }
    }
);

document.getElementById("chatInput").addEventListener(
    "keydown",
    function(e){
        if(e.key === "Enter"){
            sendChat();
        }
    }
);
</script>
